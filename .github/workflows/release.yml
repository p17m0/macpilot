name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal app
        run: scripts/bundle.sh --universal
      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent MacPilot.app "MacPilot-${GITHUB_REF_NAME}-macos-universal.zip"
          tar -czf "macpilot-cli-${GITHUB_REF_NAME}-macos-universal.tar.gz" macpilot
          shasum -a 256 *.zip *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
