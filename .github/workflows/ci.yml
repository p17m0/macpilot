name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Build the app
        run: scripts/bundle.sh

  # Every page in the light and the dark theme at the smallest window size, kept as a build artifact: a look at
  # them catches buttons drawn over text or cut-off columns before a release.
  screenshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Screenshots
        run: scripts/screenshots.sh target/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: target/screenshots/*.png
          retention-days: 14
